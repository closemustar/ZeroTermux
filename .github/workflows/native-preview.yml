name: Native UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout native UI source
        uses: actions/checkout@v6
        with:
          ref: minimal-ui
      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build emulator APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -Darch=x86_64 --no-daemon
          cat > "$RUNNER_TEMP/native-preview.sh" <<'NATIVE_PREVIEW'
          set -eu
          mkdir -p native-preview
          APK_PATH=$(find app/build/outputs/apk/debug -name '*x86_64.apk' -print -quit)
          test -n "$APK_PATH"
          adb install -g "$APK_PATH"
          adb shell wm size 1080x1920
          adb shell wm density 360
          adb shell am start -n com.termux/.app.TermuxActivity
          sleep 45
          for attempt in 1 2 3; do
            adb shell uiautomator dump /sdcard/preview-state.xml >/dev/null 2>&1 || true
            adb pull /sdcard/preview-state.xml native-preview/preview-state.xml >/dev/null 2>&1 || true
            python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ElementTree
          path = Path('native-preview/preview-state.xml')
          if path.exists():
              root = ElementTree.parse(path).getroot()
              choices = {'允许', 'ALLOW', '确定', 'OK', '同意', '继续', '暂不', '稍后', 'CANCEL'}
              for node in root.iter('node'):
                  if node.get('text', '').strip() in choices and node.get('clickable') == 'true':
                      bounds = [int(value) for value in re.findall(r'\d+', node.get('bounds', ''))]
                      if len(bounds) == 4:
                          subprocess.run(['adb', 'shell', 'input', 'tap', str((bounds[0] + bounds[2]) // 2), str((bounds[1] + bounds[3]) // 2)], check=True)
                          break
          PY
            sleep 5
          done
          adb shell am start -n com.termux/.app.TermuxActivity
          sleep 10
          adb shell input text 'clear'
          adb shell input keyevent 66
          sleep 2
          adb shell input text 'echo%sZeroTermux-Minimal-Native'
          adb shell input keyevent 66
          sleep 3
          adb exec-out screencap -p > native-preview/01-terminal.png
          adb shell input swipe 5 900 780 900 500
          sleep 3
          adb exec-out screencap -p > native-preview/02-native-menu.png
          adb shell input swipe 800 900 5 900 400
          sleep 2
          adb shell input swipe 1070 900 280 900 500
          sleep 3
          adb exec-out screencap -p > native-preview/03-sessions-files.png
          adb shell uiautomator dump /sdcard/final-preview.xml >/dev/null 2>&1 || true
          adb pull /sdcard/final-preview.xml native-preview/final-preview.xml >/dev/null 2>&1 || true
          adb logcat -d > native-preview/logcat.txt
          NATIVE_PREVIEW
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual native application and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ${{ runner.temp }}/native-preview.sh
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZeroTermux-native-ui-preview
          path: native-preview
          if-no-files-found: warn
